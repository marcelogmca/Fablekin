<div id="vn-hud-container" aria-label="Visual novel HUD">
    <div id="vn-hud-left-dock" class="vn-hud-dock vn-hud-dock-left" aria-label="Left HUD panels"></div>
    <div id="vn-hud-right-dock" class="vn-hud-dock vn-hud-dock-right" aria-label="Right HUD panels"></div>
    <div id="vn-hud-ambient-left-layer" class="vn-hud-ambient-layer" aria-label="Left ambient HUD panels"></div>
    <div id="vn-hud-ambient-layer" class="vn-hud-ambient-layer" aria-label="Right ambient HUD panels"></div>
    <nav id="vn-hud-panel-controls" aria-label="HUD panel visibility"></nav>
    <div id="vn-hud-fullscreen-layer"></div>
</div>

<div id="vn-hud-modal-overlay" class="hud-modal-hidden">
    <div id="vn-hud-modal-container">
        <div id="vn-hud-modal-header">
            <h2 id="vn-hud-modal-title">Information</h2>
            <button id="vn-hud-modal-close" type="button" title="Close Modal" aria-label="Close modal">&times;</button>
        </div>
        <div id="vn-hud-modal-content"></div>
    </div>
</div>
