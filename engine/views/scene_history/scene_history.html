<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Scene History</title>
    <link rel="stylesheet" href="../../themes/active/global.css">

    <link rel="stylesheet" href="./style.css">
    <script src="../scripts/tooltips.js"></script>
    <script src="../scripts/modals.js"></script>
</head>

<body>
    <div class="container">
        <div class="header-with-actions">
            <h1>Scene History</h1>
            <button id="refresh-btn" class="action-btn" title="Refresh history">↻ Refresh</button>
            <button id="delete-last-turn-btn" class="action-btn" title="Delete last turn"
                style="margin-left: 10px; border-color: #ff5252;">🗑️ Delete Last</button>
        </div>
        <div id="scene-thumbnails" class="scene-grid">
            <!-- Scene thumbnails will be loaded here by JavaScript -->
        </div>
    </div>
    <script src="../../vendor/js/socket.io.min.js"></script>
    <script src="../libs/socket_bootstrap.js"></script>
    <script src="./renderer_scene_history.js"></script>
</body>

</html>
