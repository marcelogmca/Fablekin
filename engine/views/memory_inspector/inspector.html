<!DOCTYPE html>
<html>
<head>
    <title>Memory Inspector</title>
    <link rel="stylesheet" href="../../themes/active/global.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css" />
    <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <meta charset="UTF-8">
    <script src="../../vendor/js/socket.io.min.js"></script>
    <script src="../libs/socket_bootstrap.js"></script>
    <script src="../scripts/modals.js"></script>
    <script src="../scripts/tooltips.js"></script>
</head>
<body class="themed-container">
    <div class="split-console-view">
        <section class="split-pane split-pane-memory">
            <div class="pane-toolbar">
                <div class="pane-toolbar-title">
                    <h2>Memory Inspector</h2>
                    <p>Interactive runtime diagnostics</p>
                </div>
            </div>
            <div class="memory-pane-layout">
                <div id="terminal-container"></div>
                <div id="macros-sidebar" class="glass-sidebar">
                    <div class="sidebar-header">
                        <h3>Command Macros</h3>
                        <button id="add-macro-btn" class="icon-btn" title="Add New Macro">+</button>
                    </div>
                    <div id="macros-container" class="macros-list">
                        <!-- Macros injected here -->
                    </div>
                </div>
            </div>
        </section>

        <section class="split-pane split-pane-system">
            <div class="pane-toolbar">
                <div class="pane-toolbar-title">
                    <h2>System Console Stream</h2>
                    <p>Live system log feed</p>
                </div>
                <div class="system-toolbar-controls">
                    <input
                        id="system-log-filter-input"
                        class="system-filter-input"
                        type="text"
                        placeholder="Filter logs (e.g. director)"
                        autocomplete="off"
                    />
                    <button id="clear-system-filter-btn" type="button" class="pane-action-btn alt-action">Reset</button>
                    <button id="clear-system-terminal-btn" type="button" class="pane-action-btn">Clear</button>
                </div>
            </div>
            <div class="system-pane-layout">
                <div id="system-terminal-mount"></div>
            </div>
        </section>
    </div>

    <script id="terminal-logic" src="terminal_commands.js"></script>
    <script src="renderer_memory.js"></script>
</body>
</html>
